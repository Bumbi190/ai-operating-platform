# Zero external service credentials. All read-only search responses are mocks.
# Project identity, immutable source evidence and no runtime activation are
# explicit CI invariants before the broader draft #343 can be decomposed.
name: Atlas OpenViking Project Read-Only Boundary

on:
  pull_request:
    paths:
      - 'apps/web/lib/atlas/openviking/**'
      - 'apps/web/lib/qa/atlas-openviking-project-readonly.test.ts'
      - 'apps/web/lib/qa/atlas-openviking-quality.test.ts'
      - 'apps/web/lib/qa/atlas-openviking-heldout-readiness.test.ts'
      - 'apps/web/lib/qa/fixtures/atlas-openviking-five-source-history.json'
      - 'apps/web/scripts/openviking-quality-evaluate.ts'
      - 'apps/web/scripts/openviking-heldout-readiness.ts'
      - 'docs/runbooks/atlas-openviking-project-readonly.md'
      - 'docs/runbooks/atlas-openviking-quality-gate.md'
      - 'docs/runbooks/atlas-openviking-heldout-readiness.md'
      - '.github/workflows/atlas-openviking-project-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-reader:
    name: OpenViking immutable project read gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prove OpenViking is disabled in this runner
        run: |
          if [ -n "$ATLAS_OPENVIKING_MODE" ] || [ -n "$ATLAS_OPENVIKING_API_KEY" ]; then
            echo "::error::OpenViking runtime mode and credentials must be absent in CI"
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Verify exact offline project reader
        working-directory: apps/web
        run: |
          npx --no vitest run lib/qa/atlas-openviking-project-readonly.test.ts lib/qa/atlas-openviking-quality.test.ts lib/qa/atlas-openviking-heldout-readiness.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/openviking-project.json"
      - name: Enforce test execution, count and zero skip
        if: always()
        run: |
          node - "$RUNNER_TEMP/openviking-project.json" <<'NODE'
          const fs = require('node:fs')
          const filename = process.argv[2]
          if (!fs.existsSync(filename)) process.exit(1)
          const report = JSON.parse(fs.readFileSync(filename, 'utf8'))
          const names = (report.testResults ?? []).map(x => x.name ?? x.testFilePath ?? '')
          const stats = {
            passed: report.numPassedTests ?? 0,
            failed: report.numFailedTests ?? 0,
            skipped: report.numPendingTests ?? 0,
            todo: report.numTodoTests ?? 0,
            suitesFailed: report.numFailedTestSuites ?? 0,
          }
          console.log(JSON.stringify(stats))
          if (!names.some(name => name.endsWith('atlas-openviking-project-readonly.test.ts'))
            || !names.some(name => name.endsWith('atlas-openviking-quality.test.ts'))
            || !names.some(name => name.endsWith('atlas-openviking-heldout-readiness.test.ts'))
            || stats.passed < 55 || stats.failed || stats.skipped || stats.todo || stats.suitesFailed) {
            console.error('::error::OpenViking source-boundary suite missing, skipped or failed')
            process.exit(1)
          }
          NODE
      - name: Reproduce frozen historical quality NO-GO (aggregates only)
        working-directory: apps/web
        run: |
          node --import tsx scripts/openviking-quality-evaluate.ts \
            --input=lib/qa/fixtures/atlas-openviking-five-source-history.json \
            --report-only > "$RUNNER_TEMP/openviking-legacy-report.json"
          node - "$RUNNER_TEMP/openviking-legacy-report.json" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (report.cohortId !== 'legacy-five-source-2026-10-15'
              || report.qualityEligibleForManualReview !== false
              || report.runtimeActivationAuthorized !== false
              || report.lexical.correctFirstSourceAllRuns !== 16
              || report.openviking.correctFirstSourceAllRuns !== 11
              || report.openviking.unsupportedCasesReturningAnySource !== 4
              || !report.reasons.includes('first_source_worse_than_lexical')) {
            console.error('::error::Historical OpenViking NO-GO evidence changed')
            process.exit(1)
          }
          console.log(JSON.stringify({
            historicalTop1Lexical: 16,
            historicalTop1OpenViking: 11,
            candidateUnsupportedFalsePositiveCases: 4,
            qualityEligibleForManualReview: false,
          }))
          NODE
      - name: Prove missing private heldout inputs fail closed
        working-directory: apps/web
        run: |
          set +e
          node --import tsx scripts/openviking-heldout-readiness.ts \
            --private-root="$RUNNER_TEMP" \
            --plan="$RUNNER_TEMP/nonexistent-private-plan.json" \
            --corpus="$RUNNER_TEMP/nonexistent-private-corpus.json" \
            > "$RUNNER_TEMP/heldout-empty.json"
          result=$?
          set -e
          if [ "$result" -ne 2 ]; then
            echo "::error::Missing private inputs did not fail closed"
            exit 1
          fi
          node - "$RUNNER_TEMP/heldout-empty.json" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (report.readyForOperatorCaptureReview !== false
              || report.runtimeActivationAuthorized !== false
              || report.reasonCodes.length !== 1
              || report.reasonCodes[0] !== 'private_inputs_missing_or_unsafe') {
            console.error('::error::Unsafe heldout private-input fallback')
            process.exit(1)
          }
          console.log('Heldout private input gate: safely blocked')
          NODE
      - name: Typecheck web workspace
        working-directory: apps/web
        run: npx tsc --noEmit
