# Isolated calendar proof SQL regression. Uses a uniquely named, labeled
# disposable PostgreSQL container required by lib/calendar/test-db.ts.
name: Calendar Proof Isolated

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-proof-isolated.yml'
      - 'apps/web/lib/calendar/direct-write-gate-proof-*'
      - 'apps/web/lib/calendar/social-*-fixture.sql'
      - 'apps/web/lib/calendar/test-db.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-proof-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start owned PostgreSQL fixture
        run: |
          set -euo pipefail
          docker run -d --name omnira-website-build-test-20261014 \
            --label com.omnira.testplan=atlas-live-build-20261014 \
            -e POSTGRES_PASSWORD=postgres postgres:16
          for attempt in {1..30}; do
            if docker exec omnira-website-build-test-20261014 pg_isready -U postgres; then
              docker exec omnira-website-build-test-20261014 psql -U postgres -v ON_ERROR_STOP=1 \
                -c 'create role anon nologin' \
                -c 'create role authenticated nologin' \
                -c 'create role service_role nologin'
              exit 0
            fi
            sleep 1
          done
          docker logs omnira-website-build-test-20261014
          exit 1
      - name: Run real inspector regression
        working-directory: apps/web
        run: |
          npx --no vitest run lib/calendar/direct-write-gate-proof-real-inspector.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/calendar-proof-inspector.json"
      - name: Enforce inspector anti-skip floor
        if: always()
        env:
          REPORT: ${{ runner.temp }}/calendar-proof-inspector.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          if (!fs.existsSync(process.env.REPORT)) throw new Error('Inspector report missing')
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'))
          const result = (report.testResults ?? []).find(r =>
            path.basename(r.name) === 'direct-write-gate-proof-real-inspector.test.ts')
          if (!result) throw new Error('Inspector test file absent')
          const assertions = result.assertionResults ?? []
          const passed = assertions.filter(a => a.status === 'passed').length
          const failed = assertions.filter(a => a.status === 'failed').length
          const skipped = assertions.filter(a => ['pending','skipped','todo','disabled'].includes(a.status)).length
          if (result.status !== 'passed' || passed < 22 || failed || skipped ||
              report.numFailedTests || report.numPendingTests || report.numTodoTests) {
            throw new Error(`Inspector SQL floor: status=${result.status} passed=${passed} failed=${failed} skipped=${skipped}`)
          }
          console.log(`Inspector SQL: ${passed} passed, 0 failed/skipped`)
          NODE
      - name: Remove owned fixture
        if: always()
        run: docker rm -f omnira-website-build-test-20261014 || true
