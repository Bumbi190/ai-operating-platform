# Diagnostic only: run the older root media dependency with the canonical web
# migration tree in an owned, network-isolated PostgreSQL container.
name: Legacy Media Replay Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/legacy-media-replay-diagnostic.yml'
      - 'apps/web/scripts/analysis-replay-order.mjs'
      - 'apps/web/scripts/analysis-replay-order.test.mjs'
      - 'apps/web/scripts/verify-analysis-drafts-local.mjs'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify migration ordering
        run: node --test apps/web/scripts/analysis-replay-order.test.mjs
      - name: Cache required image versions for the offline SQL fixture
        run: |
          set -euo pipefail
          docker pull public.ecr.aws/supabase/postgres:17.11.0.004
          docker pull public.ecr.aws/supabase/storage-api:v1.79.36
      - name: Replay the historical media dependency in an owned database
        run: node apps/web/scripts/verify-analysis-drafts-local.mjs --mode=legacy-media-replay
