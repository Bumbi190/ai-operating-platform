# Migration Guard integrity plus explicit owner-only OIDC artifact/attestation phases.
# No production DB credentials. Publishing is a separate disabled-by-default owner-only phase.

name: Migration Guard Integrity

# No paths filter: this check is intended to be eligible as a required check,
# so every pull request must create a status for it.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      oidc_phase:
        type: choice
        options: [integrity-only, build-artifact, attest-ledger, publish-preview, handoff-preview]
        default: integrity-only
        description: Owner-only phases; publication requires separate live approval and configuration
      harvey_sha:
        type: string
        description: Exact separately approved source/workflow SHA
      build_run_id:
        type: string
        description: Completed build-artifact run (attest-ledger only)
      build_artifact_id:
        type: string
        description: Immutable GitHub artifact ID (attest-ledger only)
      artifact_sha256:
        type: string
        description: SHA-256 of inner artifact.tar (not the upload ZIP digest)
      proof_run_id:
        type: string
        description: Completed owner-approved attest-ledger run
      proof_artifact_id:
        type: string
        description: Immutable sanitized proof artifact ID

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.oidc_phase != 'integrity-only' && 'harvey-oidc-owner-once' || format('migration-guard-integrity-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.oidc_phase == 'integrity-only' }}

jobs:
  integrity:
    name: Migration Guard Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Check guard module syntax
        run: |
          node --check apps/web/scripts/migration-guard-policy.mjs
          node --check apps/web/scripts/migration-guard-ledger-attestation.mjs
          node --check apps/web/scripts/harvey-oidc-ci.mjs
          node --check apps/web/scripts/check-migrations.mjs
          node --check apps/web/scripts/migration-release-policy.mjs
          node --check apps/web/scripts/migration-release-preflight.mjs

      - name: Run Migration Guard v2 integrity suite
        working-directory: apps/web
        run: |
          npx --no vitest run lib/qa/migration-guard-v2.test.ts \
            lib/qa/handlarborsen-watch-runs-migration.test.ts \
            lib/qa/sales-inbox-ledger-reconciliation.test.ts \
            lib/qa/migration-release-preflight.test.ts \
            lib/qa/migration-guard-ledger-attestation.test.ts \
            lib/qa/harvey-oidc-ci.test.ts \
            --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/migration-guard-integrity.json"

      - name: Prove the integrity suite ran without skips
        if: always()
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/migration-guard-integrity.json" <<'NODE'
          const fs = require('node:fs')
          const [, , resultsPath] = process.argv
          if (!fs.existsSync(resultsPath)) {
            console.error(`::error::no Vitest results at ${resultsPath} — the guard suite did not run`)
            process.exit(1)
          }

          const report = JSON.parse(fs.readFileSync(resultsPath, 'utf8'))
          const files = report.testResults ?? []
          const testFile = files.find((file) => String(file.name).endsWith('migration-guard-v2.test.ts'))
          if (!testFile) {
            console.error('::error::migration-guard-v2.test.ts is absent from the results')
            process.exit(1)
          }

          const sales = files.find(file => String(file.name).endsWith('/sales-inbox-ledger-reconciliation.test.ts'))
          const salesAssertions = sales?.assertionResults ?? []
          if (salesAssertions.length < 3 || salesAssertions.some(assertion => assertion.status !== 'passed')) {
            console.error('::error::all three exact sales inbox source/ledger/registry checks must pass')
            process.exit(1)
          }

          const journal = files.find((file) => String(file.name).endsWith('/handlarborsen-watch-runs-migration.test.ts'))
          const journalAssertions = journal?.assertionResults ?? []
          if (journalAssertions.length < 4 || journalAssertions.some((assertion) => assertion.status !== 'passed')) {
            console.error('::error::all four journal source/ledger/catalog/receipt promotion checks must pass')
            process.exit(1)
          }

          // Release tests use synthetic/recorded data, never hosted DB credentials.
          const release = files.find(file => String(file.name).endsWith('/migration-release-preflight.test.ts'))
          const releaseAssertions = release?.assertionResults ?? []
          if (releaseAssertions.length < 50 || releaseAssertions.some(assertion => assertion.status !== 'passed')) {
            console.error('::error::migration release safety tests must all pass without skips')
            process.exit(1)
          }

          const attest = files.find(file => String(file.name).endsWith('/migration-guard-ledger-attestation.test.ts'))
          const attestAssertions = attest?.assertionResults ?? []
          if (attestAssertions.length < 53 || attestAssertions.some(assertion => assertion.status !== 'passed')) {
            console.error('::error::all ledger provenance tests must pass without skips')
            process.exit(1)
          }

          const adapter = files.find(file => String(file.name).endsWith('/harvey-oidc-ci.test.ts'))
          const adapterAssertions = adapter?.assertionResults ?? []
          if (adapterAssertions.length < 106 || adapterAssertions.some(assertion => assertion.status !== 'passed')) {
            console.error('::error::all CI adapter boundary tests must pass without skips')
            process.exit(1)
          }

          const tally = (testFile.assertionResults ?? []).reduce(
            (counts, assertion) => ({ ...counts, [assertion.status]: (counts[assertion.status] ?? 0) + 1 }),
            {},
          )
          const passed = tally.passed ?? 0
          const notRun = (tally.pending ?? 0) + (tally.skipped ?? 0) + (tally.todo ?? 0)
          let failed = false

          if (passed < 19) {
            console.error(`::error::only ${passed} Guard v2 tests passed; expected at least 19`)
            failed = true
          }
          if (notRun > 0 || (report.numPendingTests ?? 0) > 0 || (report.numTodoTests ?? 0) > 0) {
            console.error(`::error::Guard v2 integrity tests were skipped/pending/todo: ${JSON.stringify(tally)}`)
            failed = true
          }
          if ((report.numFailedTests ?? 0) > 0 || (report.numFailedTestSuites ?? 0) > 0) {
            console.error(`::error::Guard v2 integrity failures: ${report.numFailedTests ?? 0}`)
            failed = true
          }
          if (failed) process.exit(1)
          console.log(`Migration Guard Integrity OK — ${passed} tests passed, 0 skipped/pending/todo.`)
          NODE

  # Disabled until the owner configures and reviews this separate protected environment.
  # External SHA pins and actual GitHub approval/certificate checks are mandatory.
  oidc_build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.oidc_phase == 'build-artifact' &&
      github.actor_id == '158544361' &&
      github.repository_id == '1244338545'
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: harvey-oidc-owner-once
    env: &adapter_trust
      HARVEY_OIDC_BUILD_PROFILE: harvey-oidc-test-v1
      HARVEY_OIDC_BUILD_PROJECT_ID: prj_WTzaRAskqTqYhJLVfoPtIVNAA1iS
      HARVEY_OIDC_BUILD_TEAM_ID: team_NlGVrs9ZItxkK4nMgRblBCI4
      HARVEY_OIDC_BUILD_TARGET: preview
      HARVEY_OIDC_ONCE_ENABLED: ${{ vars.HARVEY_OIDC_ONCE_ENABLED }}
      HARVEY_OIDC_APPROVED_SOURCE_SHA: ${{ vars.HARVEY_OIDC_APPROVED_SOURCE_SHA }}
      HARVEY_OIDC_TRUSTED_WORKFLOW_SHA: ${{ vars.HARVEY_OIDC_TRUSTED_WORKFLOW_SHA }}
      HARVEY_OIDC_ENVIRONMENT_ID: ${{ vars.HARVEY_OIDC_ENVIRONMENT_ID }}
      HARVEY_OIDC_GH_VERSION: ${{ vars.HARVEY_OIDC_GH_VERSION }}
      HARVEY_OIDC_VERCEL_CLI_VERSION: ${{ vars.HARVEY_OIDC_VERCEL_CLI_VERSION }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail closed before executing repository code
        shell: bash
        env: &oidc_trust
          ONCE_ENABLED: ${{ vars.HARVEY_OIDC_ONCE_ENABLED }}
          APPROVED_SHA: ${{ vars.HARVEY_OIDC_APPROVED_SOURCE_SHA }}
          TRUSTED_WORKFLOW_SHA: ${{ vars.HARVEY_OIDC_TRUSTED_WORKFLOW_SHA }}
          REQUESTED_SHA: ${{ inputs.harvey_sha }}
        run: &oidc_preflight |
          set -euo pipefail
          test "$ONCE_ENABLED" = "true"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$REQUESTED_SHA" = "$APPROVED_SHA"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$TRUSTED_WORKFLOW_SHA"
          test "$TRUSTED_WORKFLOW_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.HARVEY_OIDC_APPROVED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - &install_verified_gh
        name: Install verified GitHub CLI 2.104.0
        shell: bash
        run: |
          set -euo pipefail
          # Official v2.104.0 checksum reviewed separately; never trust a downloaded sidecar at runtime.
          test "$RUNNER_OS:$RUNNER_ARCH" = 'Linux:X64'
          test "$HARVEY_OIDC_GH_VERSION" = '2.104.0'
          [[ "$RUNNER_TEMP" = /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          test -f "$GITHUB_PATH"
          test -f "$GITHUB_ENV"
          umask 077
          gh_install_dir="$(mktemp -d "$RUNNER_TEMP/harvey-oidc-gh-2.104.0.XXXXXX")"
          trap 'rm -rf -- "$gh_install_dir"' EXIT
          gh_archive="$gh_install_dir/gh.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-redirs 3 \
            --output "$gh_archive" \
            'https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz'
          printf '%s  %s\n' '98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e' "$gh_archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$gh_archive" --directory "$gh_install_dir" \
            --no-same-owner --no-same-permissions 'gh_2.104.0_linux_amd64/bin/gh'
          gh_bin_dir="$gh_install_dir/gh_2.104.0_linux_amd64/bin"
          gh_binary="$gh_bin_dir/gh"
          test -f "$gh_binary"
          test -x "$gh_binary"
          test ! -L "$gh_binary"
          test "$(realpath -- "$gh_binary")" = "$gh_binary"
          export PATH="$gh_bin_dir:$PATH"
          hash -r
          test "$(type -t gh)" = 'file'
          test "$(command -v gh)" = "$gh_binary"
          gh_version_output="$(gh --version)"
          read -r gh_name gh_label gh_version _ <<< "$gh_version_output"
          test "$gh_name:$gh_label:$gh_version" = 'gh:version:2.104.0'
          test "$gh_version" = "$HARVEY_OIDC_GH_VERSION"
          printf 'Verified GitHub CLI binary: %s\n%s\n' "$gh_binary" "$gh_version_output"
          # Export only after verification. The hosted runner discards this job's temp directory.
          rm -- "$gh_archive"
          printf '%s\n' "$gh_bin_dir" >> "$GITHUB_PATH"
          printf 'HARVEY_OIDC_VERIFIED_GH=%s\n' "$gh_binary" >> "$GITHUB_ENV"
          trap - EXIT
      - name: Build reviewed source without publishing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(command -v gh)" = "${HARVEY_OIDC_VERIFIED_GH:?}"
          node apps/web/scripts/harvey-oidc-ci.mjs build --output "$RUNNER_TEMP/harvey-oidc-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harvey-oidc-build-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/harvey-oidc-build/artifact.tar
            ${{ runner.temp }}/harvey-oidc-build/manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

  oidc_attest:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.oidc_phase == 'attest-ledger' &&
      github.actor_id == '158544361' &&
      github.repository_id == '1244338545'
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harvey-oidc-owner-once
    env: *adapter_trust
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fail closed before executing repository code
        shell: bash
        env: *oidc_trust
        run: *oidc_preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.HARVEY_OIDC_APPROVED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - *install_verified_gh
      - name: Materialize protected export without echoing its contents
        env:
          OWNER_LEDGER: ${{ secrets.HARVEY_OIDC_LEDGER_EXPORT_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs'
          import {resolve} from 'node:path'
          const raw=process.env.OWNER_LEDGER
          if(!raw || Buffer.byteLength(raw)>48000)throw Error('Protected ledger unavailable')
          const dir=resolve(process.env.RUNNER_TEMP,'harvey-oidc-secret')
          mkdirSync(dir,{mode:0o700})
          writeFileSync(resolve(dir,'ledger.json'),raw,{flag:'wx',mode:0o600})
          NODE
      - name: Verify owner approval, immutable build and fresh ledger bytes
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_EXPORT_FILE: ${{ runner.temp }}/harvey-oidc-secret/ledger.json
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ARTIFACT_ID: ${{ inputs.build_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        shell: bash
        run: |
          test "$(command -v gh)" = "${HARVEY_OIDC_VERIFIED_GH:?}"
          node apps/web/scripts/harvey-oidc-ci.mjs prepare --output "$RUNNER_TEMP/harvey-oidc-proof"
      - name: Attest exact owner-approved export bytes
        id: ledger
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/harvey-oidc-proof/ledger.json
          show-summary: false
          push-to-registry: false
          create-storage-record: false
      - name: Verify real origin, run Guard and mint artifact-bound receipt
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_BUNDLE: ${{ steps.ledger.outputs.bundle-path }}
        shell: bash
        run: |
          test "$(command -v gh)" = "${HARVEY_OIDC_VERIFIED_GH:?}"
          node apps/web/scripts/harvey-oidc-ci.mjs guard --directory "$RUNNER_TEMP/harvey-oidc-proof"
      - name: Attest exact Guard receipt bytes
        id: receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/harvey-oidc-proof/receipt.json
          show-summary: false
          push-to-registry: false
          create-storage-record: false
      - name: Verify signatures and export evidence; publication remains forbidden
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_BUNDLE: ${{ steps.receipt.outputs.bundle-path }}
          LEDGER_EXPORT_FILE: ${{ runner.temp }}/harvey-oidc-secret/ledger.json
        shell: bash
        run: |
          test "$(command -v gh)" = "${HARVEY_OIDC_VERIFIED_GH:?}"
          node apps/web/scripts/harvey-oidc-ci.mjs evidence --directory "$RUNNER_TEMP/harvey-oidc-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harvey-oidc-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/harvey-oidc-proof/receipt.json
            ${{ runner.temp }}/harvey-oidc-proof/artifact.tar
            ${{ runner.temp }}/harvey-oidc-proof/manifest.json
            ${{ runner.temp }}/harvey-oidc-proof/receipt.sigstore.json
            ${{ runner.temp }}/harvey-oidc-proof/verification-summary.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

      - name: Always remove private ledger inputs and intermediates
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {rmSync} from 'node:fs'
          import {resolve} from 'node:path'
          const root=process.env.RUNNER_TEMP
          rmSync(resolve(root,'harvey-oidc-secret'),{recursive:true,force:true})
          for(const name of ['ledger.json','binding.json','ledger.sigstore.json'])
            rmSync(resolve(root,'harvey-oidc-proof',name),{force:true})
          NODE

  oidc_publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.oidc_phase == 'publish-preview' &&
      github.actor_id == '158544361' && github.repository_id == '1244338545'
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harvey-oidc-owner-once
    env: *adapter_trust
    permissions:
      contents: write # Git-ref creation is repo-wide; not a namespace-scoped credential.
      actions: read
    steps:
      - name: Fail closed before executing repository code
        shell: bash
        env: *oidc_trust
        run: *oidc_preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.HARVEY_OIDC_APPROVED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install exact reviewed CLI without any publishing credential
        env:
          CLI_VERSION: ${{ vars.HARVEY_OIDC_VERCEL_CLI_VERSION }}
        run: |
          [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "vercel@$CLI_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Verify exact receipt, reserve globally, then attempt one Preview publication
        env:
          GH_TOKEN: ${{ github.token }}
          HARVEY_OIDC_PUBLICATION_ENABLED: ${{ vars.HARVEY_OIDC_PUBLICATION_ENABLED }}
          HARVEY_OIDC_JOURNAL_MODE: ${{ vars.HARVEY_OIDC_JOURNAL_MODE }}
          HARVEY_OIDC_JOURNAL_IMMUTABLE_RULESET_ID: ${{ vars.HARVEY_OIDC_JOURNAL_IMMUTABLE_RULESET_ID }}
          HARVEY_OIDC_JOURNAL_CREATION_RULESET_ID: ${{ vars.HARVEY_OIDC_JOURNAL_CREATION_RULESET_ID }}
          HARVEY_OIDC_JOURNAL_CREATOR_APP_ID: ${{ vars.HARVEY_OIDC_JOURNAL_CREATOR_APP_ID }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
          PROOF_ARTIFACT_ID: ${{ inputs.proof_artifact_id }}
          VERCEL_TOKEN: ${{ secrets.HARVEY_OIDC_PREVIEW_PUBLISH_TOKEN }}
        run: node apps/web/scripts/harvey-oidc-ci.mjs publish --output "$RUNNER_TEMP/harvey-oidc-publication"

  # Explicit owner-supervised verification only. Never reserves or publishes.
  # Empty runtime config is owner-attested metadata, not technical egress isolation.
  oidc_handoff:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.oidc_phase == 'handoff-preview' &&
      github.actor_id == '158544361' && github.repository_id == '1244338545'
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harvey-oidc-owner-once
    env: *adapter_trust
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail closed before executing repository code
        shell: bash
        env: *oidc_trust
        run: *oidc_preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.HARVEY_OIDC_APPROVED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - *install_verified_gh
      - name: Materialize protected isolation review without logging its contents
        env:
          OWNER_ISOLATION: ${{ secrets.HARVEY_OIDC_ISOLATION_REVIEW_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs'
          import {resolve} from 'node:path'
          const raw=process.env.OWNER_ISOLATION
          if(!raw || Buffer.byteLength(raw)>4096)throw Error('Protected isolation review unavailable')
          const dir=resolve(process.env.RUNNER_TEMP,'harvey-oidc-secret')
          mkdirSync(dir,{mode:0o700})
          writeFileSync(resolve(dir,'isolation.json'),raw,{flag:'wx',mode:0o600})
          NODE
      - name: Verify signed Guard receipt and artifact; stop before publication
        env:
          GH_TOKEN: ${{ github.token }}
          HARVEY_OIDC_HANDOFF_ENABLED: ${{ vars.HARVEY_OIDC_HANDOFF_ENABLED }}
          HARVEY_OIDC_ISOLATION_FILE: ${{ runner.temp }}/harvey-oidc-secret/isolation.json
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
          PROOF_ARTIFACT_ID: ${{ inputs.proof_artifact_id }}
        shell: bash
        run: |
          test "$(command -v gh)" = "${HARVEY_OIDC_VERIFIED_GH:?}"
          node apps/web/scripts/harvey-oidc-ci.mjs handoff --output "$RUNNER_TEMP/harvey-oidc-handoff"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: harvey-oidc-handoff-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/harvey-oidc-handoff/handoff.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1
      - name: Always remove private isolation metadata
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {rmSync} from 'node:fs'
          import {resolve} from 'node:path'
          rmSync(resolve(process.env.RUNNER_TEMP,'harvey-oidc-secret'),{recursive:true,force:true})
          NODE
