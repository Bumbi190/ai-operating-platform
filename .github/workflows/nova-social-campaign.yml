name: Nova Social Campaign Boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-social-campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    name: Nova campaign contracts and native PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Use pinned npm 11.21.3
        run: npm install --global npm@11.21.3 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Run campaign contracts and affected regressions without provider credentials
        working-directory: apps/web
        run: |
          npx --no vitest run \
            lib/social-launch/campaign \
            lib/social-launch/preparation-receipts.test.ts \
            lib/qa/nova-social-receipts-route.test.ts \
            lib/qa/atlas-status-honesty-route.test.ts \
            lib/social-launch/content/campaign-capability.test.ts \
            lib/social-launch/publication/linkedin-adapter.test.ts \
            lib/qa/atlas-project-task-context.test.ts \
            lib/qa/m0-spend-ceiling.test.ts \
            lib/qa/ideogram-dispatch-certainty.test.ts \
            lib/qa/media-governed-dispatch.test.ts \
            lib/qa/provider-signal-delivery.test.ts \
            lib/qa/execution-authority-signal.test.ts \
            lib/qa/atlas-static-conversation-route.test.ts \
            lib/qa/handlarborsen-strato-inbox-intent.test.ts \
            --maxWorkers=2  --reporter=json --outputFile=../../nova-campaign-vitest.json
      - name: Require every suite, no skipped or failed tests
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          const required=[
            "lib/qa/atlas-project-task-context.test.ts",
            "lib/qa/atlas-static-conversation-route.test.ts",
            "lib/qa/atlas-status-honesty-route.test.ts",
            "lib/qa/execution-authority-signal.test.ts",
            "lib/qa/handlarborsen-strato-inbox-intent.test.ts",
            "lib/qa/ideogram-dispatch-certainty.test.ts",
            "lib/qa/m0-spend-ceiling.test.ts",
            "lib/qa/media-governed-dispatch.test.ts",
            "lib/qa/nova-social-receipts-route.test.ts",
            "lib/qa/provider-signal-delivery.test.ts",
            "lib/social-launch/campaign/api.test.ts",
            "lib/social-launch/campaign/atlas-tools.test.ts",
            "lib/social-launch/campaign/current-rates.test.ts",
            "lib/social-launch/campaign/drain.test.ts",
            "lib/social-launch/campaign/image.test.ts",
            "lib/social-launch/campaign/provider.test.ts",
            "lib/social-launch/campaign/store.test.ts",
            "lib/social-launch/campaign/transport.test.ts",
            "lib/social-launch/campaign/validate.test.ts",
            "lib/social-launch/campaign/view.test.ts",
            "lib/social-launch/campaign/worker.test.ts",
            "lib/social-launch/content/campaign-capability.test.ts",
            "lib/social-launch/preparation-receipts.test.ts",
            "lib/social-launch/publication/linkedin-adapter.test.ts"
          ]
          const report=JSON.parse(readFileSync('nova-campaign-vitest.json','utf8'))
          const fail=message=>{throw Error('Incomplete campaign boundary proof: '+message)}
          const files=report.testResults
          if(!Array.isArray(files)||files.length<24||report.success!==true)fail('missing results or unsuccessful run')
          for(const key of ['numTotalTests','numPassedTests','numFailedTests','numPendingTests','numTodoTests','numTotalTestSuites','numPassedTestSuites','numFailedTestSuites','numPendingTestSuites']){
            if(!Number.isSafeInteger(report[key])||report[key]<0)fail('invalid counter '+key)
          }
          if(report.numTotalTests<464||report.numFailedTests!==0||report.numPendingTests!==0||report.numTodoTests!==0||report.numFailedTestSuites!==0||report.numPendingTestSuites!==0||report.numPassedTests!==report.numTotalTests||report.numPassedTestSuites!==report.numTotalTestSuites)fail('failed, skipped, todo or inconsistent counters')
          const seen=new Set()
          let assertions=0
          for(const suite of files){
            if(typeof suite?.name!=='string'||!suite.name)fail('missing suite path')
            const normalized=suite.name.replaceAll('\\','/')
            const marker='/apps/web/'
            const relative=normalized.includes(marker)?normalized.slice(normalized.lastIndexOf(marker)+marker.length):normalized
            if(!relative.startsWith('lib/')||relative.split('/').some(part=>!part||part==='.'||part==='..')||seen.has(relative))fail('invalid or duplicate suite path '+relative)
            seen.add(relative)
            if(suite.status!=='passed'||!Array.isArray(suite.assertionResults)||suite.assertionResults.length===0||suite.assertionResults.some(test=>test?.status!=='passed'))fail('empty, failed or skipped suite '+relative)
            assertions+=suite.assertionResults.length
          }
          for(const name of required)if(!seen.has(name))fail('required suite absent: '+name)
          if(assertions!==report.numTotalTests||assertions!==report.numPassedTests)fail('assertion count disagrees with totals')
          console.log(assertions+' campaign/regression tests passed across '+files.length+' unique files with no skips or todos')
          NODE
      - name: Explicitly prepare the pinned disposable PostgreSQL image
        run: |
          docker pull postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          docker tag postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 postgres:17-alpine
      - name: Exercise native claim, reaper, cancellation and campaign SQL in a networkless disposable container
        run: node --test scripts/atlas/verify-nova-campaign.test.mjs
