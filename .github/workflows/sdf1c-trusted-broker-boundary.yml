name: SDF-1C Trusted Broker Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdf1c-trusted-broker-boundary:
    name: SDF-1C Trusted Broker Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATLAS_SQL_TEST_REQUIRED: 1
      SDF1C3_DOCKER_REQUIRED: 1
      ATLAS_SQL_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Explicit setup, OUTSIDE any CodeWork run: the broker itself never pulls (--pull=never). The
      # sandbox health-probe image is provisioned here by its immutable digest, never by a tag.
      - name: Provision the pinned sandbox probe image (setup only)
        run: docker pull docker.io/library/alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      - name: Identity, enrollment, replay, claim-credential, control-channel, isolation substrate and no-execution proofs
        working-directory: apps/web
        run: >-
          ../../node_modules/.bin/vitest run
          lib/qa/sdf1c-trusted-broker.test.ts
          lib/qa/sdf1c-trusted-broker-sql.test.ts
          lib/qa/sdf1c-trusted-broker-ui.test.ts
          lib/qa/sdf1c-broker-identity-id.test.ts
          lib/qa/sdf1c-broker-claim-credential.test.ts
          lib/qa/sdf1c-broker-claim-credential-sql.test.ts
          lib/qa/sdf1c2-broker-control-channel.test.ts
          lib/qa/sdf1c2-broker-control-channel-sql.test.ts
          lib/qa/sql-test-role-bootstrap-race.test.ts
          lib/qa/sdf1c3-isolation-substrate.test.ts
          lib/qa/sdf1c3-isolation-integration.test.ts
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/sdf1c.json"
      - name: Enforce per-file anti-skip floors
        env:
          SDF1C_REPORT: ${{ runner.temp }}/sdf1c.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const reportPath = process.env.SDF1C_REPORT
          if (!reportPath || !fs.existsSync(reportPath)) throw new Error('SDF-1C report missing')
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const required = new Map([
            ['sdf1c-trusted-broker.test.ts', 16],
            ['sdf1c-trusted-broker-sql.test.ts', 14],
            ['sdf1c-trusted-broker-ui.test.ts', 5],
            ['sdf1c-broker-identity-id.test.ts', 13],
            ['sdf1c-broker-claim-credential.test.ts', 16],
            ['sdf1c-broker-claim-credential-sql.test.ts', 18],
            ['sdf1c2-broker-control-channel.test.ts', 49],
            ['sdf1c2-broker-control-channel-sql.test.ts', 22],
            ['sql-test-role-bootstrap-race.test.ts', 4],
            ['sdf1c3-isolation-substrate.test.ts', 195],
            ['sdf1c3-isolation-integration.test.ts', 10],
          ])
          const byFile = new Map((report.testResults ?? []).map(result => [path.basename(result.name), result]))
          for (const [file, floor] of required) {
            const result = byFile.get(file)
            if (!result) throw new Error(`SDF-1C anti-skip missing file: ${file}`)
            const assertions = result.assertionResults ?? []
            const passed = assertions.filter(a => a.status === 'passed').length
            const failed = assertions.filter(a => a.status === 'failed').length
            const pending = assertions.filter(a => ['pending','skipped','todo','disabled'].includes(a.status)).length
            if (result.status !== 'passed' || passed < floor || failed !== 0 || pending !== 0) {
              throw new Error(`SDF-1C anti-skip failed for ${file}: passed=${passed} failed=${failed} pending=${pending}`)
            }
          }
          if ((report.numFailedTests ?? 0) !== 0 || (report.numPendingTests ?? 0) !== 0 || (report.numTodoTests ?? 0) !== 0) {
            throw new Error('SDF-1C aggregate anti-skip failed')
          }
          console.log('SDF-1C Trusted Broker Boundary satisfied with 0 failed / 0 pending')
          NODE
      # V1B is synthetic, offline and fail-closed. This is NOT Windows signing
      # or permission to enroll a broker. Keep these tests in the existing
      # required SDF-1C workflow instead of creating a new PR/CI chain.
      - name: Prime Agent V1B offline review - eight test files
        working-directory: apps/web
        run: >-
          ../../node_modules/.bin/vitest run
          lib/qa/atlas-model-router-ecdsa-p256-format.test.ts
          lib/qa/atlas-model-router-owner-consent-issuer-offline.test.ts
          lib/qa/atlas-model-router-owner-issuer-keyring-offline.test.ts
          lib/qa/atlas-model-router-proof-crypto.test.ts
          lib/qa/atlas-model-router-signed-desktop-evidence.test.ts
          lib/qa/atlas-model-router-windows-issued-package.test.ts
          lib/qa/atlas-model-router-windows-ksp.test.ts
          lib/qa/atlas-model-router-windows-owner-consent.test.ts
          --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/atlas-prime-v1b.json"
      - name: Prime Agent V1B - enforce exact pass and zero skip
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.env.RUNNER_TEMP
          if (!root) throw new Error('Prime V1B runner temp is missing')
          const reportPath = path.join(root, 'atlas-prime-v1b.json')
          if (!fs.existsSync(reportPath)) throw new Error('Prime V1B test report missing')
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const required = new Map([
            ['atlas-model-router-ecdsa-p256-format.test.ts', 4],
            ['atlas-model-router-owner-consent-issuer-offline.test.ts', 16],
            ['atlas-model-router-owner-issuer-keyring-offline.test.ts', 15],
            ['atlas-model-router-proof-crypto.test.ts', 1],
            ['atlas-model-router-signed-desktop-evidence.test.ts', 6],
            ['atlas-model-router-windows-issued-package.test.ts', 8],
            ['atlas-model-router-windows-ksp.test.ts', 7],
            ['atlas-model-router-windows-owner-consent.test.ts', 16],
          ])
          const results = report.testResults
          if (!Array.isArray(results) || results.length !== required.size) {
            throw new Error('Prime V1B requires exactly eight reported suites')
          }
          const seen = new Set()
          for (const suite of results) {
            const name = path.basename(suite.name || '')
            if (!required.has(name) || seen.has(name)) {
              throw new Error('Prime V1B unknown or duplicate test file: ' + name)
            }
            seen.add(name)
            const assertions = suite.assertionResults ?? []
            const passed = assertions.filter(a => a.status === 'passed').length
            const failed = assertions.filter(a => a.status === 'failed').length
            const skipped = assertions.filter(a => a.status !== 'passed' && a.status !== 'failed').length
            if (suite.status !== 'passed' || passed !== required.get(name)
                || failed !== 0 || skipped !== 0) {
              throw new Error('Prime V1B failed anti-skip: ' + name
                + ' passed=' + passed + ' failed=' + failed + ' skipped=' + skipped)
            }
          }
          if (report.numPassedTests !== 73 || report.numFailedTests !== 0
              || report.numPendingTests !== 0 || report.numTodoTests !== 0) {
            throw new Error('Prime V1B must pass exactly 73 tests, 0 failed/skip/todo')
          }
          console.log('Prime V1B offline boundary: 8 files, 73/73 pass, 0 skip')
          NODE
      - name: Typecheck web and broker identity library
        run: |
          npm run typecheck --workspace=apps/web
          npm run typecheck --prefix apps/code-broker
