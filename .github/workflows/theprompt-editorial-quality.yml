name: The Prompt Editorial Quality Safety

on:
  pull_request:
    paths:
      - 'apps/web/lib/media/quality.ts'
      - 'apps/web/lib/media/quality-validation.ts'
      - 'apps/web/lib/media/quality-validation.node-check.mjs'
      - 'apps/web/lib/media/quality-publication-boundary.node-check.mjs'
      - 'apps/web/lib/media/factcheck/**'
      - 'apps/web/lib/media/script-writer-provenance*'
      - 'apps/web/lib/media/text-client.ts'
      - 'apps/web/app/**/factcheck/**'
      - 'apps/web/app/**/media/page.tsx'
      - 'docs/workflows/proposed-migrations/*the_prompt_factcheck*'
      - 'docs/workflows/the-prompt.factcheck.v1.json'
      - 'apps/web/app/api/media/**'
      - '.github/workflows/theprompt-editorial-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove invalid editorial scores never authorize publishing
        run: node --experimental-strip-types --test apps/web/lib/media/quality-validation.node-check.mjs apps/web/lib/media/quality-publication-boundary.node-check.mjs apps/web/lib/media/factcheck/contract.node-check.mjs apps/web/lib/media/factcheck/source-collector.node-check.mjs apps/web/lib/media/factcheck/reviewer-preview.node-check.mjs apps/web/lib/media/factcheck/safe-https-reader.node-check.mjs apps/web/lib/media/factcheck/independent-review.node-check.mjs apps/web/lib/media/factcheck/reviewer-admission.node-check.mjs apps/web/lib/media/factcheck/report-ledger.node-check.mjs apps/web/lib/media/factcheck/report-record.node-check.mjs apps/web/lib/media/factcheck/report-writer.node-check.mjs apps/web/lib/media/factcheck/editorial-admission.node-check.mjs apps/web/lib/media/factcheck/owner-decision-intent.node-check.mjs apps/web/lib/media/script-writer-provenance.node-check.mjs apps/web/lib/media/script-writer-provenance-wiring.node-check.mjs apps/web/lib/media/factcheck/nova-autonomy-policy.node-check.mjs apps/web/lib/media/factcheck/nova-shadow-receipt.node-check.mjs
