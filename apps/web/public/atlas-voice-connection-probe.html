<!doctype html>
<html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · anslutningsprov</title>
<style>body{margin:0;background:#07101f;color:#edf4fc;font:18px system-ui,sans-serif;line-height:1.6}main{max-width:560px;margin:8vh auto;padding:24px}h1{font-size:30px}a{color:#80e5d9}button{font:inherit;padding:14px 20px;background:#80e5d9;color:#061c23;border:0;border-radius:12px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:90px;padding:20px;border:1px solid #304052;border-radius:12px;margin-top:24px;overflow-wrap:anywhere}</style>
<main><h1>Kontrollera Atlas anslutning</h1>
<p>Det här provet använder varken mikrofonen eller rösttjänsten. Det tar normalt ungefär fem sekunder.</p>
<p><a href="/atlas/rosttest">Öppna Atlas</a> för att logga in om det behövs, och gå sedan tillbaka hit.</p>
<button id="test">Testa anslutningen</button><p id="status" role="status" aria-live="polite">Redo att testa.</p>
<script>
const button=document.getElementById('test'),status=document.getElementById('status');
function probe(stage,payload,rejectExpected){
  return new Promise(resolve=>{
    const url=new URL('/api/atlas/voice-pilot/stream',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';
    const started=performance.now();
    let socket,finished=false,echoed=false,opened=null,errored=false,rejectionTimer;
    const timer=setTimeout(()=>finish(false,errored?'socket_error':'timeout'),14000);
    function finish(ok,reason,closeCode=0){
      if(finished)return;finished=true;clearTimeout(timer);clearTimeout(rejectionTimer);
      if(socket&&socket.readyState<2)socket.close();
      resolve({ok,stage,reason,closeCode,elapsedMs:Math.round(performance.now()-started),opened:opened!==null,echoed});
    }
    try{
      socket=new WebSocket(url);socket.binaryType='arraybuffer';
      socket.onopen=()=>{if(finished)return;opened=performance.now();if(rejectExpected)rejectionTimer=setTimeout(()=>finish(false,'rejection_timeout'),2500);socket.send(payload);};
      socket.onmessage=event=>{if(finished)return;if(rejectExpected){finish(false,'unexpected_frame');return;}const data=event.data instanceof ArrayBuffer?new Uint8Array(event.data):null;echoed=!!data&&data.length===4&&data[0]===0&&data[1]===255&&data[2]===33&&data[3]===18;if(!echoed)finish(false,'unexpected_frame');};
      socket.onclose=event=>{
        const elapsed=opened===null?0:performance.now()-opened,code=event.code||0;
        if(errored&&!rejectExpected){finish(false,'socket_error',code);return;}
        if(opened===null){finish(false,errored?'socket_error':'not_opened',code);return;}
        if(rejectExpected){finish(!echoed&&elapsed<2500,elapsed<2500?'rejected':'rejection_timeout',code);return;}
        if(!echoed){finish(false,elapsed<4500?'deadline':'no_echo',code);return;}
        finish(elapsed>=4500&&elapsed<9000&&code===1000,elapsed<4500||elapsed>=9000?'deadline':code===1000?'verified':'unclean_close',code);
      };
      socket.onerror=()=>{errored=true;};
    }catch{finish(false,'setup_error');}
  });
}
button.onclick=async()=>{
  button.disabled=true;status.textContent='Kontrollerar anslutningen…';
  let result=await probe('echo',new Uint8Array([0,255,33,18]),false);
  if(result.ok)result=await probe('oversize',new Uint8Array(6405),true);
  if(result.ok)result=await probe('text','synthetic probe',true);
  button.disabled=false;
  status.textContent=result.ok?'Anslutningen fungerar. Du kan meddela chatten att provet lyckades.':
    'Anslutningen kunde inte verifieras. Skicka gärna en bild av resultatet till chatten. Kod: '+result.stage+'/'+result.reason+
    ' · '+result.elapsedMs+' ms · öppnad: '+(result.opened?'ja':'nej')+' · eko: '+(result.echoed?'ja':'nej')+' · stängning: '+result.closeCode+'.';
};
</script></main></html>
