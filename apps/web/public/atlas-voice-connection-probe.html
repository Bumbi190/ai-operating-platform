<!doctype html>
<html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · anslutningsprov</title>
<style>body{margin:0;background:#07101f;color:#edf4fc;font:18px system-ui,sans-serif;line-height:1.6}main{max-width:560px;margin:8vh auto;padding:24px}h1{font-size:30px}a{color:#80e5d9}button{font:inherit;padding:14px 20px;background:#80e5d9;color:#061c23;border:0;border-radius:12px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:90px;padding:20px;border:1px solid #304052;border-radius:12px;margin-top:24px}</style>
<main><h1>Kontrollera Atlas anslutning</h1>
<p>Det här provet använder varken mikrofonen eller rösttjänsten. Det tar ungefär fem sekunder.</p>
<p><a href="/atlas/rosttest">Logga först in i Atlas på denna sida</a> och gå sedan tillbaka hit.</p>
<button id="test">Testa anslutningen</button><p id="status" role="status" aria-live="polite">Redo att testa.</p>
<script>
const button=document.getElementById('test'),status=document.getElementById('status');
button.onclick=()=>{
  button.disabled=true;status.textContent='Kontrollerar anslutningen…';
  const url=new URL('/api/atlas/voice-pilot/stream',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';
  let socket,finished=false,echoed=false,opened=0;
  const timer=setTimeout(()=>finish(false),14000);
  function finish(ok){if(finished)return;finished=true;clearTimeout(timer);button.disabled=false;if(socket&&socket.readyState<2)socket.close();status.textContent=ok?'Anslutningen fungerar. Du kan meddela chatten att provet lyckades.':'Anslutningen kunde inte verifieras. Kontrollera att du är inloggad via länken ovan och försök igen. Meddela chatten om det fortfarande inte fungerar.';}
  try{
    socket=new WebSocket(url);socket.binaryType='arraybuffer';
    socket.onopen=()=>{opened=performance.now();socket.send(new Uint8Array([0,255,33,18]));};
    socket.onmessage=event=>{const data=event.data instanceof ArrayBuffer?new Uint8Array(event.data):null;echoed=!!data&&data.length===4&&data[0]===0&&data[1]===255&&data[2]===33&&data[3]===18;if(!echoed)finish(false);};
    socket.onclose=()=>finish(echoed&&opened>0&&performance.now()-opened>=4500&&performance.now()-opened<9000);
    socket.onerror=()=>finish(false);
  }catch{finish(false);}
};
</script></main></html>
