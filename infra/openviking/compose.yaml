name: omnira-openviking-pilot-20261015
services:
  models:
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    container_name: omnira-openviking-models-20261015
    profiles: [local-gpu]
    gpus: all
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - models:/root/.ollama
    mem_limit: 3g
    cpus: 3
    restart: "no"
  openviking:
    image: ghcr.io/volcengine/openviking:v0.5.0@sha256:c60a83cd79cfce80db5266acb8bdd0908eee8abe8ff559a5f786aa504c251ccf
    container_name: omnira-openviking-server-20261015
    profiles: [local-gpu]
    depends_on:
      - models
    ports:
      - "127.0.0.1:19330:1933"
    volumes:
      - state_vectors:/app/.openviking
      - ${OPENVIKING_LOCAL_CONFIG:?Set the private absolute ov.conf path}:/app/.openviking/ov.conf:ro
    mem_limit: 2g
    cpus: 2
    restart: "no"
volumes:
  models:
  state_vectors:
